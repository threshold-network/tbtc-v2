# Additive Bitcoin script fuzz tests; Hardhat owns deployment artifacts.
# See test-foundry/README.md for the pinned toolchain and commands.
[profile.default]
src = "contracts"
test = "test-foundry"
out = "forge-artifacts"
cache_path = "cache_forge"
libs = ["node_modules", "lib"]
# Match Hardhat's compiler settings, including solc 0.8.17's default EVM target.
solc_version = "0.8.17"
evm_version = "london"
optimizer = true
optimizer_runs = 1000
auto_detect_remappings = false
remappings = [
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/",
    "@keep-network/=node_modules/@keep-network/",
    "@threshold-network/=node_modules/@threshold-network/",
    "@thesis/=node_modules/@thesis/",
    "forge-std/=lib/forge-std/src/"
]

# Mirror hardhat.config.ts's per-contract optimizer overrides.
additional_compiler_profiles = [
    { name = "runs-200", optimizer_runs = 200 },
    { name = "runs-1", optimizer_runs = 1 }
]
compilation_restrictions = [
    { paths = "node_modules/@keep-network/ecdsa/contracts/WalletRegistry.sol", optimizer_runs = 200 },
    { paths = "contracts/bridge/BridgeGovernance.sol", optimizer_runs = 200 },
    { paths = "contracts/cross-chain/wormhole/L1BTCDepositorNttWithExecutor.sol", optimizer_runs = 1 }
]

[profile.default.fuzz]
runs = 256

[profile.ci.fuzz]
runs = 1000
