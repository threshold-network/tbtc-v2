name: NPM Typescript

on:
  push:
    branches:
      - main
    paths:
      - "typescript/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-compile-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
          cache-dependency-path: typescript/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      # The locked `@keep-network/tbtc-v2` has an indirect dependency on
      # `@summa-tx/relay-sol@2.0.2`, which downloads a sub-dependency via unauthenticated
      # `git://` protocol. That protocol is no longer supported. Thanks to this
      # step `https://` is used instead of `git://`.
      - name: Configure git to don't use unauthenticated protocol
        run: git config --global url."https://".insteadOf git://

      # Upstream contract updates must be reviewed with their manifest and lock
      # changes before publishing. See .github/RELEASING.md.
      - name: Install reviewed dependencies
        run: yarn install --immutable

      - name: Compile
        run: yarn build

      - name: Bump up package version
        id: npm-version-bump
        uses: threshold-network/ci/actions/npm-version-bump@20b35345d276a3c7365e3829b8078387a7c9dccb
        with:
          work-dir: ./typescript
          environment: dev
          branch: ${{ github.ref }}
          commit: ${{ github.sha }}

      - name: Pack package without publishing credentials
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --ignore-scripts --script-shell=/usr/bin/false --pack-destination "$RUNNER_TEMP/npm-package"

      - name: Publish prepared package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          packages=("$RUNNER_TEMP/npm-package"/*.tgz)
          test "${#packages[@]}" -eq 1
          test -f "${packages[0]}"
          npm publish "${packages[0]}" --ignore-scripts --access=public --tag=development
