name: NPM Typescript

on:
  push:
    branches:
      - main
    paths:
      - "typescript/**"
  workflow_dispatch:
    inputs:
      skip_governance_check:
        description: "Skip the mainnet deposit reveal-ahead governance verification step (emergency publish only)"
        type: boolean
        default: false

jobs:
  npm-compile-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./typescript
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
          cache-dependency-path: typescript/yarn.lock

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate

      # We need this step because the `@keep-network/tbtc-v2` which we update in
      # next step has an indirect dependency to `@summa-tx/relay-sol@2.0.2`
      # package, which downloads one of its sub-dependencies via unathenticated
      # `git://` protocol. That protocol is no longer supported. Thanks to this
      # step `https://` is used instead of `git://`.
      - name: Configure git to don't use unauthenticated protocol
        run: git config --global url."https://".insteadOf git://

      - name: Resolve latest contracts
        run: |
          yarn up --exact \
            '@keep-network/ecdsa@development' \
            '@keep-network/tbtc-v2@development'

      - name: Compile
        run: yarn build

      - name: Verify mainnet deposit reveal-ahead period
        if: (github.event_name != 'workflow_dispatch' || inputs.skip_governance_check != true) && vars.SKIP_GOVERNANCE_CHECK != 'true'
        env:
          CHAIN_API_URL: ${{ secrets.ETHEREUM_MAINNET_RPC_URL }}
        run: yarn check:mainnet-deposit-parameters

      - name: Bump up package version
        id: npm-version-bump
        uses: keep-network/npm-version-bump@v2
        with:
          work-dir: ./typescript
          environment: dev
          branch: ${{ github.ref }}
          commit: ${{ github.sha }}

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access=public --tag=development
