name: Cross-chain Arbitrum

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
    paths:
      - "cross-chain/arbitrum/**"
      - "config/**"
      - ".github/workflows/cross-chain-arbitrum.yml"
  pull_request:

jobs:
  contracts-detect-changes:
    runs-on: ubuntu-latest
    outputs:
      path-filter: ${{ steps.filter.outputs.path-filter }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'

      - uses: dorny/paths-filter@v2
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            path-filter:
              - './cross-chain/arbitrum/**'
              - './config/**'
              - './.github/workflows/cross-chain-arbitrum.yml'

  # Build the solidity package once per run and share it with this rail's
  # other jobs via an artifact, instead of each job re-installing and
  # re-building it in ./solidity (R2 of the CI speed plan).
  solidity-build:
    needs: contracts-detect-changes
    if: |
      github.event_name != 'pull_request'
        || needs.contracts-detect-changes.outputs.path-filter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: yarn
          cache-dependency-path: solidity/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install solidity dependencies
        working-directory: ./solidity
        run: yarn install

      - name: Build solidity package
        working-directory: ./solidity
        run: yarn build

      # `solidity/cache/validations.json` is also shipped: the post-compile
      # task in this rail's hardhat config merges the OpenZeppelin upgrade
      # validation entries for the staged L1BTCDepositorWormholeV2 artifact
      # from there, not just from `solidity/build`.
      - name: Upload solidity build
        uses: actions/upload-artifact@v4
        with:
          name: solidity-build
          path: |
            solidity/build
            solidity/cache/validations.json

  contracts-build-and-test:
    needs: [contracts-detect-changes, solidity-build]
    if: |
      github.event_name != 'pull_request'
        || needs.contracts-detect-changes.outputs.path-filter == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cross-chain/arbitrum
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: yarn
          cache-dependency-path: cross-chain/arbitrum/yarn.lock

      # A workaround for transitive dependencies that use the obsolete git://
      # prefix instead of the recommended https://
      - name: Configure git to not use unauthenticated protocol
        run: git config --global url."https://".insteadOf git://

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      # The post-compile task copies the L1BTCDepositorWormholeV2 artifact
      # from the shared `solidity-build` job's artifact into this package's
      # build directory.
      - name: Download solidity build
        uses: actions/download-artifact@v4
        with:
          name: solidity-build
          path: solidity

      - name: Build contracts
        run: yarn build

      - name: Run tests
        env:
          HARDHAT_MOCHA_PARALLEL: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
        run: yarn test

  contracts-deployment-dry-run:
    needs: [contracts-detect-changes, solidity-build]
    if: |
      github.event_name != 'pull_request'
        || needs.contracts-detect-changes.outputs.path-filter == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cross-chain/arbitrum
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: yarn
          cache-dependency-path: cross-chain/arbitrum/yarn.lock

      # A workaround for transitive dependencies that use the obsolete git://
      # prefix instead of the recommended https://
      - name: Configure git to not use unauthenticated protocol
        run: git config --global url."https://".insteadOf git://

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download solidity build
        uses: actions/download-artifact@v4
        with:
          name: solidity-build
          path: solidity

      - name: Deploy contracts
        run: yarn deploy

  contracts-format:
    needs: [contracts-detect-changes, solidity-build]
    if: |
      github.event_name == 'push'
        || needs.contracts-detect-changes.outputs.path-filter == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cross-chain/arbitrum
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: yarn
          cache-dependency-path: cross-chain/arbitrum/yarn.lock

      # A workaround for transitive dependencies that use the obsolete git://
      # prefix instead of the recommended https://
      - name: Configure git to not use unauthenticated protocol
        run: git config --global url."https://".insteadOf git://

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Download solidity build
        uses: actions/download-artifact@v4
        with:
          name: solidity-build
          path: solidity

      - name: Build
        run: yarn build

      - name: Check formatting
        run: yarn format

  contracts-slither:
    needs: contracts-detect-changes
    if: |
      github.event_name == 'push'
        || needs.contracts-detect-changes.outputs.path-filter == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cross-chain/arbitrum
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: yarn
          cache-dependency-path: cross-chain/arbitrum/yarn.lock

      - uses: actions/setup-python@v4
        with:
          python-version: 3.10.8

      - name: Install Solidity
        env:
          SOLC_VERSION: 0.8.17 # according to solidity.version in hardhat.config.ts
        run: |
          pip3 install solc-select
          solc-select install $SOLC_VERSION
          solc-select use $SOLC_VERSION

      - name: Install Slither
        env:
          SLITHER_VERSION: 0.8.3
        run: pip3 install slither-analyzer==$SLITHER_VERSION

      # A workaround for transitive dependencies that use the obsolete git://
      # prefix instead of the recommended https://
      - name: Configure git to not use unauthenticated protocol
        run: git config --global url."https://".insteadOf git://

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Run Slither
        run: slither --hardhat-artifacts-directory build .
