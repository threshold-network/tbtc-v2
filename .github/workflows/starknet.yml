name: Starknet Solidity

on:
  pull_request:
    paths:
      - "cross-chain/starknet/**"
      - ".github/workflows/starknet.yml"
  push:
    branches: [dev, main]
    paths:
      - "cross-chain/starknet/**"
      - ".github/workflows/starknet.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cross-chain/starknet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: yarn
          cache-dependency-path: cross-chain/starknet/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn test
      - run: yarn prepack
