name: NPM publication tests

on:
  pull_request:
    paths:
      - ".github/workflows/npm-typescript.yml"
      - ".github/workflows/npm-contracts.yml"
      - ".github/workflows/npm-publication-tests.yml"
      - ".github/tests/npm-publication.test.cjs"
      - "typescript/package.json"
      - "solidity/package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.4"
      - run: node --test .github/tests/npm-publication.test.cjs
