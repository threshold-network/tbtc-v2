name: Cross-chain Solana

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
    paths:
      - "cross-chain/solana/**"
      - ".github/workflows/cross-chain-solana.yml"
  pull_request:

jobs:
  contracts-detect-changes:
    runs-on: ubuntu-latest
    outputs:
      path-filter: ${{ steps.filter.outputs.path-filter }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'

      - uses: dorny/paths-filter@v2
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            path-filter:
              - './cross-chain/solana/**'
              - './.github/workflows/cross-chain-solana.yml'

  # Compiles and links the Solana programs (tbtc + wormhole-gateway) with the
  # real SBF toolchain. This verifies the on-chain programs build under a pinned,
  # reproducible toolchain.
  #
  # NOTE: this job intentionally does NOT run `anchor test`. The ts-mocha
  # integration suite (tests/**) requires a local validator that clones Wormhole
  # / Token Bridge state from mainnet, and the suite currently fails to bootstrap
  # in a fresh CI runner (the base `tbtc` program's `initialize` aborts at the
  # toolchain/harness level, unrelated to any single change). Running it here
  # would either be a permanent red check or, worse, a green check masking a
  # fully-failing suite. The test cases remain committed under tests/ so they can
  # be run locally (`anchor test`) or wired up once the harness is fixed.
  contracts-build:
    needs: contracts-detect-changes
    if: |
      github.event_name != 'pull_request'
        || needs.contracts-detect-changes.outputs.path-filter == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cross-chain/solana
    env:
      # Anchor 0.28.0 pairs with the Solana 1.16.x toolchain; the programs are
      # locked against solana-program 1.14.22 (see cross-chain/solana/Cargo.lock).
      SOLANA_VERSION: "1.16.5"
      ANCHOR_VERSION: "0.28.0"
      # Anchor 0.28 and its build deps predate current stable Rust; 1.75.0 is the
      # last toolchain that compiles this dependency tree.
      RUST_VERSION: "1.75.0"
    steps:
      - uses: actions/checkout@v4

      # A workaround for transitive dependencies that use the obsolete git://
      # prefix instead of the recommended https://
      - name: Configure git to not use unauthenticated protocol
        run: git config --global url."https://".insteadOf git://

      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain "$RUST_VERSION" --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Solana ${{ env.SOLANA_VERSION }}
        run: |
          # release.solana.com is decommissioned (Solana Labs -> Anza migration)
          # and Anza does not host 1.16.x, so install the proven 1.16.5 build
          # straight from the solana-labs GitHub release assets. `curl -f` makes
          # a bad download fail the step loudly instead of silently no-op'ing.
          curl -sSfL -o /tmp/solana.tar.bz2 \
            "https://github.com/solana-labs/solana/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          mkdir -p "$HOME/solana"
          tar -xjf /tmp/solana.tar.bz2 -C "$HOME/solana"
          echo "$HOME/solana/solana-release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor ${{ env.ANCHOR_VERSION }}
        run: |
          cargo install --git https://github.com/coral-xyz/anchor \
            --tag "v${ANCHOR_VERSION}" anchor-cli --locked

      - name: Verify toolchain
        run: |
          solana --version
          anchor --version
          rustc --version

      - name: Anchor build
        run: anchor build --arch sbf
