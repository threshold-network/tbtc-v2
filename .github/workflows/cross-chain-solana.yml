name: Cross-chain Solana

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
    paths:
      - "cross-chain/solana/**"
      - ".github/workflows/cross-chain-solana.yml"
  pull_request:

jobs:
  contracts-detect-changes:
    runs-on: ubuntu-latest
    outputs:
      path-filter: ${{ steps.filter.outputs.path-filter }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'

      - uses: dorny/paths-filter@v2
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            path-filter:
              - './cross-chain/solana/**'
              - './.github/workflows/cross-chain-solana.yml'

  contracts-build-and-test:
    needs: contracts-detect-changes
    if: |
      github.event_name != 'pull_request'
        || needs.contracts-detect-changes.outputs.path-filter == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cross-chain/solana
    env:
      # Pin the on-chain program toolchain. Anchor 0.28.0 pairs with the
      # Solana 1.16.x toolchain, and the programs are locked against
      # solana-program 1.14.22 (see cross-chain/solana/Cargo.lock).
      SOLANA_VERSION: "1.16.5"
      ANCHOR_VERSION: "0.28.0"
      # Anchor 0.28 and its transitive build deps predate current stable Rust;
      # 1.75.0 is the last toolchain that compiles this dependency tree.
      RUST_VERSION: "1.75.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18.x"
          cache: "npm"
          cache-dependency-path: cross-chain/solana/package-lock.json

      # A workaround for transitive dependencies that use the obsolete git://
      # prefix instead of the recommended https://
      - name: Configure git to not use unauthenticated protocol
        run: git config --global url."https://".insteadOf git://

      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain "$RUST_VERSION" --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Solana ${{ env.SOLANA_VERSION }}
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor ${{ env.ANCHOR_VERSION }}
        run: |
          cargo install --git https://github.com/coral-xyz/anchor \
            --tag "v${ANCHOR_VERSION}" anchor-cli --locked

      - name: Verify toolchain
        run: |
          solana --version
          anchor --version
          rustc --version

      - name: Install dependencies
        run: npm ci

      # There is a problem with the `solana-keygen new` command in CI. The
      # workaround is to create a throwaway keyfile manually, used only for
      # spinning up the local test validator (never a real key).
      - name: Prepare local test wallet
        run: |
          solana config set -u localhost
          mkdir -p ~/.config/solana
          echo "[132,196,51,204,234,79,135,213,169,81,250,90,73,168,28,41,193,49,153,71,192,44,228,74,230,78,211,95,54,241,137,50,119,155,54,147,229,137,197,57,146,111,140,177,222,54,120,254,254,250,191,135,251,47,163,16,180,160,110,108,54,111,84,76]" > ~/.config/solana/id.json

      - name: Anchor build and test
        run: anchor test --arch sbf
